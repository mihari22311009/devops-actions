name: Release

on:
  push:
    tags: v2.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar pacote
        run: zip -r pacote.zip . -x ".git/*" ".github/*"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: pacote.zip
          generate_release_notes: true
